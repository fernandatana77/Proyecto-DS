# Blueprint de Render (https://render.com) - despliegue con PostgreSQL.

databases:
  - name: inventario-db
    databaseName: inventario_tic
    user: inventario_user
    plan: free
    region: oregon

services:
  - type: web
    name: inventario-tic
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: ENTORNO
        value: produccion
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString
      # - key: SEMBRAR_DEMO      # poner "off" para NO cargar datos demo al arrancar
      #   value: "off"